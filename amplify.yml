version: 1
# Receita de build do Amplify Hosting para um app Vite (frontend) com
# backend Amplify Gen 2. O backend (auth/data) é implantado na fase de
# backend; o frontend é buildado e publicado a partir de dist/.
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Implanta o backend (Cognito/AppSync/DynamoDB) para esta branch e
        # gera o amplify_outputs.json usado pelo frontend.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
